# @package _global_
# Recognize each take from its HELD-OUT clip (different bars of the same take).
# Stock EvidenceGraphLM over the model from audio_riffs_pretrain.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: naive_scan_1
  - /monty/learning_module: evidence_audio
  - /monty/sensor_module: audio
  - /monty/connectivity: 1lm_1audio
  - /environment: audio_riffs_eval
  - /env_interface: audio_riffs_eval
  - /env_interface/transform: none
  - /termination: any1_objectrecognition_t64_e100_tot500
  - /logging: basic_info_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models/audio_riffs_pretrain/pretrained}
    seed: 42
    supervised_lm_ids: []

    logging:
      run_name: audio_riffs_eval
