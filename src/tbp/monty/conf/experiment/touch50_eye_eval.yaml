# @package _global_
# Touch in MuJoCo, 50 objects, the eye alone (its LM from touch50_both_pretrain).
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: evidence_1lm_nn5_dod0025
  - /monty/sensor_module: camera_surf_delta
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_ycb_touch50_eye
  - /env_interface: touch50_eval
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_objectrecognition_t1000_e500_tot5000
  - /logging: basic_info_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 1
    n_eval_epochs: ${constants.rotations_3_count}
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models/touch50_eye_from_both/pretrained}
    seed: 42
    supervised_lm_ids: []
    logging:
      run_name: touch50_eye_eval
