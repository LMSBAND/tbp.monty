# @package _global_
# Transposition (key as pose): the C-minor takes are presented under their
# A-minor names. A match means the A-minor memory recognized the same shape a
# minor third up. Graded against the A-minor object, which is the claim.
# Stock EvidenceGraphLM over audio_riffs_pretrain_no_cm, which never heard C minor.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3
  - /monty/motor_system_config: naive_scan_1
  - /monty/learning_module: evidence_audio
  - /monty/sensor_module: audio
  - /monty/connectivity: 1lm_1audio
  - /environment: audio_riffs_eval
  - /env_interface: audio_riffs_eval
  - /env_interface/transform: none
  - /termination: any1_objectrecognition_t64_e100_tot500
  - /logging: basic_info_monty_runs

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    n_train_epochs: 1
    n_eval_epochs: 1
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models/audio_riffs_pretrain_no_cm/pretrained}
    seed: 42
    supervised_lm_ids: []
    eval_env_interface_args:
      object_names: [swing_am, chords_am]
    environment:
      env_init_args:
        files:
          swing_am: swing_cm
          chords_am: chords_cm
    logging:
      run_name: audio_riffs_eval_transposed
