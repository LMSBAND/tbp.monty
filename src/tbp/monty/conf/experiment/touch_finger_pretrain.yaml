# @package _global_
# Touch in MuJoCo, pretraining (finger): only_surf_agent_training_10obj on four objects with materials.
defaults:
  - /monty: graph_exp1000_e3_t3
  - /monty/motor_system_config: surface_curvature_informed_goal0
  - /monty/learning_module: displacement_finger
  - /monty/sensor_module: camera_surf_finger
  - /monty/connectivity: 1lm_finger
  - /environment: mujoco_ycb_touch_agent
  - /env_interface: touch4_train
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /termination: any1_train_steps_3_1000_tot6000
  - /logging: silent_warning_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    n_train_epochs: ${constants.rotations_all_count}
    n_eval_epochs: 1
    model_name_or_path: ''
    seed: 42
    supervised_lm_ids: all
    logging:
      run_name: touch_finger_pretrain
