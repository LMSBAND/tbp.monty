# @package experiment.config.environment
# mujoco_ycb_touch_only_texture on 50 YCB objects (all but the lettered variants, chain, dice and the peg
# test). Materials by what the objects are: friction, contact stiffness (solref time constant: smaller is
# harder) and a Penn Haptic Texture Toolkit model. Many share a material (four cardboard boxes, four tin
# cans, a dozen plastics), so for those only shape tells them apart.
defaults:
  - mujoco_ycb_touch_only_texture
env_init_args:
  materials:
    cracker_box:          {friction: [0.7, 0.005, 0.0001], solref: [0.02, 1.0], texture: Cardboard}   # cardboard
    sugar_box:            {friction: [0.7, 0.005, 0.0001], solref: [0.02, 1.0], texture: Cardboard}   # cardboard
    pudding_box:          {friction: [0.7, 0.005, 0.0001], solref: [0.02, 1.0], texture: Cardboard}   # cardboard
    gelatin_box:          {friction: [0.7, 0.005, 0.0001], solref: [0.02, 1.0], texture: Cardboard}   # cardboard
    master_chef_can:      {friction: [0.4, 0.005, 0.0001], solref: [0.005, 1.0], texture: Aluminum}   # bare tin
    potted_meat_can:      {friction: [0.4, 0.005, 0.0001], solref: [0.005, 1.0], texture: Aluminum}   # tin
    tomato_soup_can:      {friction: [0.4, 0.005, 0.0001], solref: [0.005, 1.0], texture: Aluminum}   # tin
    tuna_fish_can:        {friction: [0.4, 0.005, 0.0001], solref: [0.005, 1.0], texture: Aluminum}   # tin
    bleach_cleanser:      {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # HDPE bottle
    mustard_bottle:       {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic bottle
    windex_bottle:        {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic bottle
    pitcher_base:         {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic pitcher
    bowl:                 {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic bowl
    plate:                {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic plate
    spatula:              {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic spatula
    large_marker:         {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic marker
    power_drill:          {friction: [0.45, 0.005, 0.0001], solref: [0.01, 1.0], texture: Textured Rubber}   # plastic + rubber grip
    extra_large_clamp:    {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic clamp
    large_clamp:          {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic clamp
    medium_clamp:         {friction: [0.35, 0.005, 0.0001], solref: [0.01, 1.0], texture: ABS Plastic}   # plastic clamp
    rubiks_cube:          {friction: [0.3, 0.005, 0.0001], solref: [0.01, 1.0], texture: Vinyl 1}   # stickered plastic
    mug:                  {friction: [0.3, 0.005, 0.0001], solref: [0.005, 1.0], texture: Ceramic}   # glazed ceramic: slick, hard
    adjustable_wrench:    {friction: [0.35, 0.005, 0.0001], solref: [0.005, 1.0], texture: Metal Shelving}   # steel
