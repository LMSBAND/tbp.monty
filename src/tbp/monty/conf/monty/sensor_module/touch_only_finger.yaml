# @package experiment.config.monty_config.sensor_modules
# The fingertip and nothing else: TouchSM first, so the surface policy steers by it. Location and normal
# from the contact, principal directions and curvatures by palpation, grip and stiffness from the solver.
sensor_module_0:
  _target_: tbp.monty.frameworks.models.sensor_modules.TouchSM
  sensor_module_id: finger
  features: [grip, stiffness, principal_curvatures, principal_curvatures_log]
  delta_thresholds:
    on_object: 0
    n_steps: 20
    grip: 0.05
    stiffness: 0.5
    pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
    principal_curvatures_log: [2, 2]
    distance: 0.01
