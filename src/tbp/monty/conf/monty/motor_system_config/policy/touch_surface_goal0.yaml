# @package experiment.config.monty_config.motor_system_config.policy_selector.policy
# The curvature-informed surface policy steered by the fingertip alone (TouchSurfacePolicy): reach to
# touch, back to the last touch on a slip, jumps judged by touch. No view finder, no patch camera.
defaults:
  - action_sampler: constant_surf

_target_: tbp.monty.frameworks.models.motor_policies.TouchSurfacePolicy
use_goal_driven_actions: false
agent_id: agent_id_0
touch_sensor_id: finger
desired_object_distance: 0.025
alpha: 0.1
pc_alpha: 0.5
max_pc_bias_steps: 32
min_general_steps: 8
min_heading_steps: 12
