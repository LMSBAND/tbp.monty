# @package experiment.config.monty_config.learning_modules
# The stock EvidenceGraphLM, with tolerances in auditory units. The location
# already encodes (log-lag, place); features are the second opinion.
learning_module_0:
  _target_: tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM
  max_match_distance: 0.01
  tolerances:
    audio:
      pitch_semis: 1.362      # ~136 cents, octave-invariant
      place_centroid: 8.0     # cochlear channels
      timbre: ${np.array:[0.4, 0.4, 0.4, 0.4]}   # log10 harmonic ratios
  feature_weights:
    audio:
      pitch_semis: 1.0
      place_centroid: 1.0
      timbre: ${np.ones:4}
  x_percent_threshold: 20
  evidence_threshold_config: 80%
  gsg:
    _target_: tbp.monty.frameworks.models.goal_generation.EvidenceGoalGenerator
    goal_tolerances:
      location: 0.015
    min_post_goal_success_steps: 5
  hypotheses_updater_args:
    max_nneighbors: 10
