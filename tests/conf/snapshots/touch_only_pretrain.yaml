experiment:
  config:
    do_eval: false
    do_train: true
    monty_config:
      monty_class: ${monty.class:tbp.monty.frameworks.models.graph_matching.MontyForGraphMatching}
      monty_args:
        num_exploratory_steps: 1000
        min_eval_steps: 3
        min_train_steps: 3
      motor_system_config:
        policy_selector:
          policy:
            action_sampler:
              _target_: tbp.monty.frameworks.actions.action_samplers.ConstantSampler
              actions:
              - ${monty.class:tbp.monty.frameworks.actions.actions.MoveForward}
              - ${monty.class:tbp.monty.frameworks.actions.actions.MoveTangentially}
              - ${monty.class:tbp.monty.frameworks.actions.actions.OrientHorizontal}
              - ${monty.class:tbp.monty.frameworks.actions.actions.OrientVertical}
            _target_: tbp.monty.frameworks.models.motor_policies.TouchSurfacePolicy
            use_goal_driven_actions: false
            agent_id: agent_id_0
            touch_sensor_id: finger
            desired_object_distance: 0.025
            alpha: 0.1
            pc_alpha: 0.5
            max_pc_bias_steps: 32
            min_general_steps: 8
            min_heading_steps: 12
          _target_: tbp.monty.frameworks.models.motor_policy_selectors.SinglePolicySelector
        _target_: tbp.monty.frameworks.models.motor_system.MotorSystem
      learning_modules:
        learning_module_0:
          _target_: tbp.monty.frameworks.models.displacement_matching.DisplacementGraphLM
          k: 10
          match_attribute: displacement
          tolerance: ${np.array:[0.0001, 0.0001, 0.0001]}
          graph_delta_thresholds:
            finger:
              distance: 0.01
              pose_vectors: ${np.list_eval:[np.pi / 8, np.pi * 2, np.pi * 2]}
              grip: 0.05
              stiffness: 0.5
              principal_curvatures_log:
              - 2
              - 2
      sensor_modules:
        sensor_module_0:
          _target_: tbp.monty.frameworks.models.sensor_modules.TouchSM
          sensor_module_id: finger
          features:
          - grip
          - stiffness
          - principal_curvatures
          - principal_curvatures_log
          delta_thresholds:
            on_object: 0
            n_steps: 20
            grip: 0.05
            stiffness: 0.5
            pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
            principal_curvatures_log:
            - 2
            - 2
            distance: 0.01
      sm_to_agent_dict:
        finger: agent_id_0
      sm_to_lm_matrix:
      - - 0
      lm_to_lm_matrix: null
      lm_to_lm_vote_matrix: null
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/mujoco/objects/ycb}
        convex_decomposition: true
        materials:
          mug:
            friction:
            - 0.3
            - 0.005
            - 0.0001
            solref:
            - 0.005
            - 1.0
            texture: Ceramic
          banana:
            friction:
            - 0.9
            - 0.005
            - 0.0001
            solref:
            - 0.05
            - 1.0
            texture: Candle
          master_chef_can:
            friction:
            - 0.4
            - 0.005
            - 0.0001
            solref:
            - 0.005
            - 1.0
            texture: Aluminum
          cracker_box:
            friction:
            - 0.7
            - 0.005
            - 0.0001
            solref:
            - 0.02
            - 1.0
            texture: Cardboard
        agents:
        - _target_: tbp.monty.simulators.mujoco.agents.SurfaceAgent
          _partial_: true
          agent_id: agent_id_0
          sensor_configs: {}
          touch:
            _target_: tbp.monty.simulators.mujoco.agents.TouchConfig
            sensor_id: finger
            position:
            - 0.0
            - 0.0
            - 0.0
            radius: 0.04
            drag_speed: 5.0
            palpate: 0.01
          position:
          - 0.0
          - 1.5
          - 0.1
        raise_actuate_missing: false
      env_init_func: ${monty.class:tbp.monty.simulators.mujoco.MuJoCoSimulator}
      transform: null
    train_env_interface_args:
      object_names:
      - mug
      - banana
      - master_chef_can
      - cracker_box
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        rotations: ${constants.rotations_all}
    train_env_interface_class: ${monty.class:tbp.monty.experiment.environment.OneObjectPerEpisodeInterface}
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    recognition_strategy:
      _target_: tbp.monty.experiment.recognition_strategy.Any
      strategies:
      - _target_: tbp.monty.experiment.recognition_strategy.StepLimit
        min_train_steps: 3
        num_exploring_steps: 1000
        max_train_steps: 1000
        max_eval_steps: 500
      - _target_: tbp.monty.experiment.recognition_strategy.MaxTotalSteps
        max_total_steps: 6000
      - _target_: tbp.monty.experiment.recognition_strategy.MontyIsDone
    logging:
      python_log_level: WARNING
      python_log_to_file: true
      python_log_to_stderr: true
      output_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/my_trained_models}
      monty_data_logger:
        _target_: tbp.monty.frameworks.loggers.exp_logger.BaseMontyLogger
        handlers: []
      run_name: touch_only_pretrain
    show_sensor_output: false
    n_train_epochs: ${constants.rotations_all_count}
    n_eval_epochs: 1
    model_name_or_path: ''
    seed: 42
    supervised_lm_ids: all
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
episodes: all
num_parallel: 16
print_cfg: false
constants:
  default_all_noise_params:
    features:
      pose_vectors: 2
      hsv: 0.1
      principal_curvatures_log: 0.1
      pose_fully_defined: 0.01
    location: 0.002
  default_sensor_features:
  - pose_vectors
  - pose_fully_defined
  - on_object
  - hsv
  - principal_curvatures_log
  min_eval_steps: 20
  pretrained_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_ycb_v14}
  compositional_pretrained_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/pretrained_compositional_objects_v10}
  rotations_all_count: 14
