experiment:
  config:
    do_eval: false
    do_train: true
    monty_config:
      monty_class: ${monty.class:tbp.monty.frameworks.models.graph_matching.MontyForGraphMatching}
      monty_args:
        num_exploratory_steps: 1000
        min_eval_steps: 3
        min_train_steps: 3
      motor_system_config:
        policy_selector:
          policy:
            action_sampler:
              _target_: tbp.monty.frameworks.actions.action_samplers.ConstantSampler
              actions:
              - ${monty.class:tbp.monty.frameworks.actions.actions.MoveForward}
              - ${monty.class:tbp.monty.frameworks.actions.actions.MoveTangentially}
              - ${monty.class:tbp.monty.frameworks.actions.actions.OrientHorizontal}
              - ${monty.class:tbp.monty.frameworks.actions.actions.OrientVertical}
            _target_: tbp.monty.frameworks.models.motor_policies.TouchSurfacePolicy
            use_goal_driven_actions: false
            agent_id: agent_id_0
            touch_sensor_id: finger
            desired_object_distance: 0.025
            alpha: 0.1
            pc_alpha: 0.5
            max_pc_bias_steps: 32
            min_general_steps: 8
            min_heading_steps: 12
          _target_: tbp.monty.frameworks.models.motor_policy_selectors.SinglePolicySelector
        _target_: tbp.monty.frameworks.models.motor_system.MotorSystem
      learning_modules:
        learning_module_0:
          _target_: tbp.monty.frameworks.models.displacement_matching.DisplacementGraphLM
          k: 10
          match_attribute: displacement
          tolerance: ${np.array:[0.0001, 0.0001, 0.0001]}
          graph_delta_thresholds:
            finger:
              distance: 0.01
              pose_vectors: ${np.list_eval:[np.pi / 8, np.pi * 2, np.pi * 2]}
              grip: 0.05
              stiffness: 0.5
              principal_curvatures_log:
              - 2
              - 2
              roughness: 0.1
              vibration_centroid: 30
      sensor_modules:
        sensor_module_0:
          _target_: tbp.monty.frameworks.models.sensor_modules.TouchSM
          sensor_module_id: finger
          features:
          - grip
          - stiffness
          - principal_curvatures
          - principal_curvatures_log
          - roughness
          - vibration_centroid
          delta_thresholds:
            on_object: 0
            n_steps: 20
            grip: 0.05
            stiffness: 0.5
            pose_vectors: ${np.list_eval:[np.pi / 4, np.pi * 2, np.pi * 2]}
            principal_curvatures_log:
            - 2
            - 2
            distance: 0.01
            roughness: 0.1
            vibration_centroid: 30
      sm_to_agent_dict:
        finger: agent_id_0
      sm_to_lm_matrix:
      - - 0
      lm_to_lm_matrix: null
      lm_to_lm_vote_matrix: null
    environment:
      env_init_args:
        data_path: ${path.expanduser:${oc.env:MONTY_DATA}/mujoco/objects/ycb}
        convex_decomposition: true
